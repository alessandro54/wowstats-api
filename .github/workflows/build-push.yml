name: Build & Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOKKU_APP: wow-meta

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Delete old container versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name || github.event.workflow_run.repository.name }}
          package-type: container
          min-versions-to-keep: 5
          delete-untagged-versions: true

  deploy:
    name: Deploy to Dokku
    needs: build-push
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    environment:
      name: production
      url: https://api.wowstats.gg

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DOKKU_HOST }} >> ~/.ssh/known_hosts

      - name: Enforce worker resource limits
        run: |
          # Host has 2 CPUs; docker rejects --cpus above that. Keep this in sync
          # with the box or the worker process silently fails to start.
          ssh dokku@${{ secrets.DOKKU_HOST }} resource:limit \
            --process-type worker --cpu 1.5 --memory 7000 ${{ env.DOKKU_APP }}
          ssh dokku@${{ secrets.DOKKU_HOST }} resource:report ${{ env.DOKKU_APP }}

      - name: Deploy image to Dokku
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHA::7}"
          ssh dokku@${{ secrets.DOKKU_HOST }} git:from-image ${{ env.DOKKU_APP }} "$IMAGE"

      - name: Smoke test /up
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              -H "Host: api.wowstats.gg" "http://${{ secrets.DOKKU_HOST }}/up" || true)
            echo "attempt $i → HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "::error::/up did not return 200 after deploy"
          exit 1
