name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]

env:
  RAILS_ENV: test

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Run RuboCop
        run: |
          bundle exec rubocop --format progress --color

      - name: Run Steep
        run: bundle exec steep check --severity-level error

  test:
    name: Test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wow_bis_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Setup database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wow_bis_test
        run: |
          bundle exec rails db:create db:migrate

      - name: Run RSpec tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wow_bis_test
        run: |
          bundle exec rspec --format progress --color

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        with:
          directory: ./coverage
          flags: backend
          name: backend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
        if: always()
