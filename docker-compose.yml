name: wow-stats

services:
  db:
    # pgvector/pgvector:pg18 matches production's PG 18 and ships the `vector`
    # extension with HNSW, so the embedding migrations and the prod dump
    # (which CREATE EXTENSION vector) restore cleanly. Multi-arch image: Docker
    # pulls linux/arm64 natively on Apple Silicon / OCI Ampere; platform is
    # pinned so an amd64 daemon can't silently emulate the wrong arch.
    image: pgvector/pgvector:pg18
    platform: linux/arm64
    # PG18 images store data in a major-version subdir, so the volume mounts at
    # /var/lib/postgresql (not /data) — see docker-library/postgres#1259.
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # DB_POOL defaults to 130; raise max_connections above it so dev sync
    # jobs don't exhaust the server.
    command: postgres -c max_connections=200
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: config/docker/Dockerfile.dev
    command: ./bin/rails server -b 0.0.0.0
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    env_file:
      - .env
    stdin_open: true
    tty: true

  worker:
    build:
      context: .
      dockerfile: config/docker/Dockerfile.dev
    command: ./bin/rails solid_queue:start
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    env_file:
      - .env

volumes:
  postgres_data:
  bundle_cache:
